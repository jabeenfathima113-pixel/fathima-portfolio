
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Data Fetcher | My Portfolio</title>

    <style>
        /* =========================
           GLOBAL THEME
        ========================= */
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5eee6;
            --surface: #fffaf5;
            --primary: #795548;
            --primary-dark: #5c4033;
            --accent: #a47148;
            --border: #d8c8b8;
            --text: #46352c;
            --muted: #79685d;
            --hover: #eee0d1;
            --shadow: 0 8px 25px rgba(92, 64, 51, 0.12);
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button,
        input {
            font: inherit;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px rgba(92, 64, 51, 0.06);
            z-index: 1000;
        }

        .logo {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links > a,
        .dropbtn {
            padding: 10px 0;
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-links > a:hover,
        .dropbtn:hover {
            color: var(--accent);
        }

        /* Projects dropdown */
        .dropdown {
            position: relative;
        }

        .dropbtn {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 210px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1100;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 16px;
            color: var(--primary-dark);
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .dropdown-content a:hover {
            background: var(--hover);
        }

        /* =========================
           MAIN CONTENT
        ========================= */
        .page-content {
            min-height: 100vh;
            padding: 110px 20px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* =========================
           API CONTAINER
        ========================= */
        .container {
            width: 100%;
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .container h1 {
            margin: 0 0 15px;
            color: var(--primary-dark);
            font-size: 30px;
        }

        .intro {
            margin-bottom: 25px;
            color: var(--muted);
            line-height: 1.7;
        }

        /* =========================
           FETCH BUTTON
        ========================= */
        #fetchButton {
            padding: 12px 22px;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #fetchButton:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        #fetchButton:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */
        #status {
            min-height: 24px;
            margin: 20px 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================
           API RESULTS
        ========================= */
        #postList {
            padding-left: 28px;
            margin: 20px 0 0;
        }

        #postList li {
            margin: 16px 0;
            padding: 18px;
            background: #f8f0e8;
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow-wrap: anywhere;
        }

        #postList li h3 {
            margin: 0 0 10px;
            color: var(--primary-dark);
            font-size: 17px;
            line-height: 1.5;
            text-transform: capitalize;
        }

        #postList li p {
            margin: 0;
            color: var(--text);
            font-size: 14px;
            line-height: 1.7;
        }

        /* =========================
           MOBILE RESPONSIVENESS
        ========================= */
        @media (max-width: 700px) {
            .navbar {
                padding: 12px 18px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .logo {
                font-size: 22px;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                gap: 10px 18px;
            }

            .nav-links > a,
            .dropbtn {
                font-size: 14px;
            }

            .dropdown-content {
                left: 0;
                min-width: 190px;
            }

            .page-content {
                padding: 150px 15px 30px;
            }

            .container {
                padding: 22px 18px;
            }

            .container h1 {
                font-size: 26px;
            }

            #postList {
                padding-left: 22px;
            }

            #postList li {
                padding: 14px;
            }
        }

        @media (max-width: 380px) {
            .nav-links {
                gap: 8px 12px;
            }

            .container h1 {
                font-size: 23px;
            }

            #fetchButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html" class="logo">My Portfolio</a>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#about">About</a>

            <div class="dropdown">
                <button
                    type="button"
                    class="dropbtn"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    Projects <span aria-hidden="true">▾</span>
                </button>

                <div class="dropdown-content">
                    <a href="../project1/para.html">Project 1</a>
                    <a href="../project2/colorpicker.html">Color Picker</a>
                    <a href="../project3/clock.html">Digital Clock</a>
                    <a href="../project4/calculator.html">Calculator</a>
                    <a href="../project5/api.html">API Fetch</a>
                    <a href="../project6/timer.html">Timer</a>
                    <a href="../project7/signal.html">Traffic Signal</a>
                    <a href="../project8/registrationform.html">Registration Form</a>
                    <a href="../project9/imageslider.html">Image Slider</a>
                    <a href="../project10/todo.html">To-Do List</a>
                </div>
            </div>

            <a href="../index.html#contact">Contact</a>
        </div>
    </nav>

    <!-- =========================
         API DATA FETCHER
    ========================= -->
    <main class="page-content">
        <section class="container" aria-labelledby="page-title">
            <h1 id="page-title">API Data Fetcher</h1>

            <p class="intro">
                Click the button below to fetch posts from an online API
                and display the results.
            </p>

            <button type="button" id="fetchButton">
                Fetch Data
            </button>

            <p id="status" role="status" aria-live="polite">
                Click "Fetch Data" to load posts.
            </p>

            <ol id="postList"></ol>
        </section>
    </main>

    <!-- =========================
         JAVASCRIPT
    ========================= -->
    <script>
        // Projects dropdown functionality
        const dropdown = document.querySelector(".dropdown");
        const dropButton = document.querySelector(".dropbtn");

        dropButton.addEventListener("click", function (event) {
            event.stopPropagation();

            const isOpen = dropdown.classList.toggle("active");
            dropButton.setAttribute("aria-expanded", String(isOpen));
        });

        // Close the dropdown when clicking outside it
        document.addEventListener("click", function (event) {
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
            }
        });

        // Close the dropdown using the Escape key
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
                dropButton.focus();
            }
        });

        // API fetching functionality
        const fetchButton = document.getElementById("fetchButton");
        const postList = document.getElementById("postList");
        const status = document.getElementById("status");

        fetchButton.addEventListener("click", async function () {
            fetchButton.disabled = true;
            postList.replaceChildren();
            status.textContent = "Loading posts...";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts"
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch data.");
                }

                const posts = await response.json();

                if (!Array.isArray(posts) || posts.length === 0) {
                    status.textContent = "No posts were found.";
                    return;
                }

                posts.slice(0, 10).forEach(function (post) {
                    const listItem = document.createElement("li");
                    const title = document.createElement("h3");
                    const description = document.createElement("p");

                    title.textContent = post.title;
                    description.textContent = post.body;

                    listItem.append(title, description);
                    postList.appendChild(listItem);
                });

                status.textContent =
                    "10 posts loaded successfully.";
            } catch (error) {
                status.textContent =
                    "Unable to load posts. Check your internet connection and try again.";
            } finally {
                fetchButton.disabled = false;
            }
        });
    </script>

</body>
</html>
