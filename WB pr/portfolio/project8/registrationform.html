<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form | My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5eee6;
            --surface: #fffaf5;
            --primary: #795548;
            --primary-dark: #5c4033;
            --accent: #a47148;
            --border: #d8c8b8;
            --text: #46352c;
            --hover: #eee0d1;
            --shadow: 0 8px 25px rgba(92, 64, 51, 0.12);
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-top: 75px;
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 9999;
        }

        .logo {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links > a,
        .dropbtn {
            color: var(--primary-dark);
            font-family: inherit;
            font-size: 16px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-links > a:hover,
        .dropbtn:hover {
            color: var(--accent);
        }

        /* PROJECTS DROPDOWN */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 210px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 10000;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 16px;
            color: var(--primary-dark);
            text-decoration: none;
        }

        .dropdown-content a:hover {
            background: var(--hover);
        }

        /* REGISTRATION FORM */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 35px 20px;
        }

        .form-container {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 25px;
            font-size: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: var(--primary-dark);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fffdfb;
            color: var(--text);
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid var(--accent);
            border-color: var(--accent);
        }

        .password-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .password-wrapper input {
            flex: 1;
        }

        .toggle-password {
            flex-shrink: 0;
            background: var(--hover);
            color: var(--primary-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .toggle-password:hover,
        #refreshCaptcha:hover {
            background: #e3d0bd;
        }

        /* CAPTCHA */
        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #captchaText {
            flex: 1;
            padding: 12px;
            background: var(--hover);
            color: var(--primary-dark);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 5px;
            text-align: center;
            border-radius: 6px;
            user-select: none;
            overflow-wrap: anywhere;
        }

        #refreshCaptcha {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            background: var(--hover);
            color: var(--primary-dark);
            font-size: 20px;
        }

        /* REGISTER BUTTON */
        #submitButton {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #submitButton:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        #submitButton:disabled {
            background: #b8a99d;
            cursor: not-allowed;
        }

        .message {
            font-size: 13px;
            margin-top: 5px;
            line-height: 1.5;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        /* MOBILE LAYOUT */
        @media (max-width: 700px) {
            body {
                padding-top: 140px;
            }

            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 5%;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                gap: 10px 18px;
            }

            .nav-links > a,
            .dropbtn {
                font-size: 14px;
            }

            .main-content {
                padding: 25px 15px;
            }

            .form-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="../index.html" class="logo">My Portfolio</a>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#about">About</a>

            <div class="dropdown">
                <button
                    type="button"
                    class="dropbtn"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    Projects ▾
                </button>

                <div class="dropdown-content">
                    <a href="../project1/para.html">Project 1</a>
                    <a href="../project2/colorpicker.html">Color Picker</a>
                    <a href="../project3/clock.html">Digital Clock</a>
                    <a href="../project4/calculator.html">Calculator</a>
                    <a href="../project5/api.html">API Fetch</a>
                    <a href="../project6/timer.html">Timer</a>
                    <a href="../project7/signal.html">Traffic Signal</a>
                    <a href="../project8/registrationform.html">Registration Form</a>
                    <a href="../project9/imageslider.html">Image Slider</a>
                    <a href="../project10/todo.html">To-Do List</a>
                </div>
            </div>

            <a href="../index.html#contact">Contact</a>
        </div>
    </nav>

    <!-- REGISTRATION FORM -->
    <main class="main-content">
        <div class="form-container">
            <h1>Registration</h1>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >👁</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Show confirm password"
                            aria-pressed="false"
                        >👁</button>
                    </div>

                    <p id="passwordMessage" class="message"></p>
                </div>

                <div class="form-group">
                    <label for="captchaInput">CAPTCHA Verification</label>

                    <div class="captcha-box">
                        <span id="captchaText"></span>

                        <button
                            type="button"
                            id="refreshCaptcha"
                            aria-label="Generate new CAPTCHA"
                        >↻</button>
                    </div>

                    <input
                        type="text"
                        id="captchaInput"
                        placeholder="Enter CAPTCHA"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" id="submitButton" disabled>
                    Register
                </button>

                <p id="status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <script>
        // REGISTRATION FORM
        const form = document.getElementById("registrationForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const captchaText = document.getElementById("captchaText");
        const captchaInput = document.getElementById("captchaInput");
        const submitButton = document.getElementById("submitButton");
        const passwordMessage = document.getElementById("passwordMessage");
        const status = document.getElementById("status");

        let captchaCode = "";

        function generateCaptcha() {
            const characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            captchaCode = "";

            for (let i = 0; i < 6; i++) {
                captchaCode += characters[
                    Math.floor(Math.random() * characters.length)
                ];
            }

            captchaText.textContent = captchaCode;
            captchaInput.value = "";
            checkForm();
        }

        function checkForm() {
            const passwordsMatch =
                password.value !== "" &&
                password.value === confirmPassword.value;

            const captchaMatches =
                captchaInput.value.trim().toUpperCase() === captchaCode;

            passwordMessage.textContent =
                confirmPassword.value === ""
                    ? ""
                    : passwordsMatch
                        ? "Passwords match."
                        : "Passwords do not match.";

            passwordMessage.style.color =
                passwordsMatch ? "#477a42" : "#b42318";

            submitButton.disabled = !(
                form.checkValidity() &&
                passwordsMatch &&
                captchaMatches
            );
        }

        // Show or hide passwords
        document.querySelectorAll(".toggle-password").forEach(function (button) {
            button.addEventListener("click", function () {
                const input = document.getElementById(button.dataset.target);
                const showing = input.type === "text";

                input.type = showing ? "password" : "text";

                button.setAttribute(
                    "aria-label",
                    showing ? "Show password" : "Hide password"
                );

                button.setAttribute("aria-pressed", String(!showing));
            });
        });

        form.addEventListener("input", checkForm);

        document.getElementById("refreshCaptcha").addEventListener(
            "click",
            generateCaptcha
        );

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            checkForm();

            if (submitButton.disabled) {
                status.textContent =
                    "Please check all fields, password matching, and CAPTCHA.";
                return;
            }

            status.textContent =
                "Registration successful! This is a demonstration only.";

            form.reset();

            document.querySelectorAll(".toggle-password").forEach(function (button) {
                const input = document.getElementById(button.dataset.target);
                input.type = "password";
                button.setAttribute("aria-pressed", "false");
                button.setAttribute("aria-label", "Show password");
            });

            passwordMessage.textContent = "";
            generateCaptcha();
            checkForm();
        });

        generateCaptcha();

        // PROJECTS DROPDOWN
        const dropdown = document.querySelector(".dropdown");
        const dropButton = document.querySelector(".dropbtn");

        dropButton.addEventListener("click", function (event) {
            event.stopPropagation();

            const isOpen = dropdown.classList.toggle("active");
            dropButton.setAttribute("aria-expanded", String(isOpen));
        });

        // Close when clicking outside
        document.addEventListener("click", function (event) {
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
            }
        });

        // Close with Escape
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
                dropButton.focus();
            }
        });
    </script>

</body>
</html>
