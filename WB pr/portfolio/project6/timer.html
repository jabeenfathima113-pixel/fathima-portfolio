
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer App | My Portfolio</title>

    <style>
        /* =========================
           GLOBAL STYLES
        ========================= */
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5eee6;
            --surface: #fffaf5;
            --primary: #795548;
            --primary-dark: #5c4033;
            --accent: #a47148;
            --border: #d8c8b8;
            --text: #46352c;
            --muted: #79685d;
            --shadow: 0 8px 25px rgba(92, 64, 51, 0.12);
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button,
        input {
            font: inherit;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px rgba(92, 64, 51, 0.06);
            z-index: 1000;
        }

        .logo {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links > a,
        .dropbtn {
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px 0;
            transition: color 0.2s ease;
        }

        .nav-links > a:hover,
        .dropbtn:hover {
            color: var(--accent);
        }

        /* Projects dropdown */
        .dropdown {
            position: relative;
        }

        .dropbtn {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 205px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1100;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 16px;
            color: var(--primary-dark);
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .dropdown-content a:hover {
            background: #eee0d1;
        }

        /* =========================
           MAIN CONTENT
           Keeps timer centered BELOW navbar
        ========================= */
        .page-content {
            min-height: 100vh;
            padding: 105px 20px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           TIMER CONTAINER
        ========================= */
        .timer-container {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .timer-container h1 {
            margin: 0 0 12px;
            color: var(--primary-dark);
            font-size: 30px;
        }

        .description {
            margin: 0 0 25px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 14px;
            text-align: left;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 0 0 15px;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 7px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(164, 113, 72, 0.14);
        }

        /* =========================
           BUTTONS
        ========================= */
        .timer-container button {
            padding: 11px 17px;
            border: none;
            border-radius: 7px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .timer-container button:hover {
            background: var(--primary-dark);
        }

        .timer-container button:active {
            transform: scale(0.97);
        }

        .set-button {
            width: 100%;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .buttons button {
            min-width: 85px;
        }

        /* =========================
           TIMER DISPLAY
        ========================= */
        #display {
            margin: 25px 0;
            color: var(--primary);
            font-size: clamp(42px, 10vw, 58px);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        #status {
            min-height: 24px;
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================
           MOBILE RESPONSIVENESS
        ========================= */
        @media (max-width: 700px) {
            .navbar {
                padding: 12px 18px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .logo {
                font-size: 22px;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                gap: 10px 18px;
            }

            .nav-links > a,
            .dropbtn {
                font-size: 14px;
            }

            .dropdown-content {
                left: 0;
                min-width: 190px;
            }

            .page-content {
                padding: 150px 16px 30px;
                min-height: 100vh;
            }

            .timer-container {
                padding: 25px 20px;
            }
        }

        @media (max-width: 380px) {
            .nav-links {
                gap: 8px 12px;
            }

            .timer-container h1 {
                font-size: 26px;
            }

            .buttons {
                gap: 7px;
            }

            .buttons button {
                min-width: 75px;
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html" class="logo">My Portfolio</a>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#about">About</a>

            <div class="dropdown">
                <button
                    type="button"
                    class="dropbtn"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    Projects <span aria-hidden="true">▾</span>
                </button>

                <div class="dropdown-content">
                    <a href="../project1/para.html">Project 1</a>
                    <a href="../project2/colorpicker.html">Color Picker</a>
                    <a href="../project3/clock.html">Digital Clock</a>
                    <a href="../project4/calculator.html">Calculator</a>
                    <a href="../project5/api.html">API Fetch</a>
                    <a href="../project6/timer.html">Timer</a>
                    <a href="../project7/signal.html">Traffic Signal</a>
                    <a href="../project8/registrationform.html">Registration Form</a>
                    <a href="../project9/imageslider.html">Image Slider</a>
                    <a href="../project10/todo.html">To-Do List</a>
                </div>
            </div>

            <a href="../index.html#contact">Contact</a>
        </div>
    </nav>

    <!-- =========================
         TIMER APP
    ========================= -->
    <main class="page-content">
        <section class="timer-container" aria-labelledby="timer-title">
            <h1 id="timer-title">Timer App</h1>

            <p class="description">
                Set your time and start the countdown.
            </p>

            <label for="customTime">Enter time in seconds:</label>

            <input
                type="number"
                id="customTime"
                min="1"
                max="86400"
                step="1"
                value="60"
            >

            <button type="button" id="setTimer" class="set-button">
                Set Timer
            </button>

            <div id="display" role="timer" aria-label="Time remaining">
                01:00
            </div>

            <div class="buttons">
                <button type="button" id="start">Start</button>
                <button type="button" id="pause">Pause</button>
                <button type="button" id="reset">Reset</button>
            </div>

            <p id="status" role="status" aria-live="polite">
                Ready to start.
            </p>
        </section>
    </main>

    <!-- =========================
         JAVASCRIPT
    ========================= -->
    <script>
        // Projects dropdown
        const dropdown = document.querySelector(".dropdown");
        const dropButton = document.querySelector(".dropbtn");

        dropButton.addEventListener("click", function (event) {
            event.stopPropagation();

            const isOpen = dropdown.classList.toggle("active");
            dropButton.setAttribute("aria-expanded", String(isOpen));
        });

        document.addEventListener("click", function (event) {
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
                dropButton.focus();
            }
        });

        // Timer elements
        const customTime = document.getElementById("customTime");
        const display = document.getElementById("display");
        const status = document.getElementById("status");

        let remainingSeconds = 60;
        let initialSeconds = 60;
        let timerId = null;
        let endTime = null;

        // Format seconds as MM:SS or HH:MM:SS
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remaining = seconds % 60;

            if (hours > 0) {
                return [
                    String(hours).padStart(2, "0"),
                    String(minutes).padStart(2, "0"),
                    String(remaining).padStart(2, "0")
                ].join(":");
            }

            return String(minutes).padStart(2, "0") + ":" +
                   String(remaining).padStart(2, "0");
        }

        function updateDisplay() {
            display.textContent = formatTime(remainingSeconds);
        }

        function stopTimer() {
            if (timerId !== null) {
                clearInterval(timerId);
                timerId = null;
            }

            endTime = null;
        }

        function tick() {
            if (endTime === null) return;

            remainingSeconds = Math.max(
                0,
                Math.ceil((endTime - Date.now()) / 1000)
            );

            updateDisplay();

            if (remainingSeconds <= 0) {
                stopTimer();
                status.textContent = "Time is up!";
            }
        }

        // Set timer
        document.getElementById("setTimer")
            .addEventListener("click", function () {
                const value = Number(customTime.value);

                if (
                    !Number.isInteger(value) ||
                    value < 1 ||
                    value > 86400
                ) {
                    status.textContent =
                        "Enter a whole number from 1 to 86400.";
                    return;
                }

                stopTimer();

                initialSeconds = value;
                remainingSeconds = value;

                updateDisplay();
                status.textContent = "Timer set successfully.";
            });

        // Start timer
        document.getElementById("start")
            .addEventListener("click", function () {
                if (timerId !== null) return;

                if (remainingSeconds <= 0) {
                    status.textContent = "Set a new timer first.";
                    return;
                }

                endTime = Date.now() + remainingSeconds * 1000;
                status.textContent = "Timer is running.";

                // Update immediately, then refresh the display regularly.
                tick();
                timerId = setInterval(tick, 200);
            });

        // Pause timer
        document.getElementById("pause")
            .addEventListener("click", function () {
                if (timerId === null) {
                    status.textContent = "Timer is not running.";
                    return;
                }

                tick();
                stopTimer();
                status.textContent =
                    remainingSeconds > 0
                        ? "Timer paused."
                        : "Time is up!";
            });

        // Reset timer
        document.getElementById("reset")
            .addEventListener("click", function () {
                stopTimer();
                remainingSeconds = initialSeconds;
                updateDisplay();
                status.textContent = "Timer reset.";
            });

        // Initial display
        updateDisplay();
    </script>

</body>
</html>
