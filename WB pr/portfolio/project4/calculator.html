
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5eee6;
            --surface: #fffaf5;
            --primary: #795548;
            --primary-dark: #5c4033;
            --accent: #a47148;
            --border: #d8c8b8;
            --text: #46352c;
            --hover: #eee0d1;
            --shadow: 0 8px 25px rgba(92, 64, 51, 0.12);
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px rgba(92, 64, 51, 0.06);
            z-index: 1000;
        }

        .logo {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links > a,
        .dropbtn {
            color: var(--primary-dark);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px 0;
        }

        .nav-links > a:hover,
        .dropbtn:hover {
            color: var(--accent);
        }

        /* PROJECT DROPDOWN */
        .dropdown {
            position: relative;
        }

        .dropbtn {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 210px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1100;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 16px;
            color: var(--primary-dark);
            font-size: 14px;
            text-decoration: none;
        }

        .dropdown-content a:hover {
            background: var(--hover);
        }

        /* CENTERED CALCULATOR AREA */
        .page-content {
            min-height: 100vh;
            padding: 100px 20px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CALCULATOR */
        .calculator {
            width: 320px;
            max-width: 100%;
            padding: 22px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .calculator h2 {
            color: var(--primary-dark);
            text-align: center;
            margin: 0 0 20px;
        }

        #display {
            width: 100%;
            height: 70px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 27px;
            font-weight: bold;
            text-align: right;
            color: var(--primary-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f5eee6;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .buttons button {
            padding: 18px 0;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #e9d9c9;
            color: var(--primary-dark);
            transition: background 0.2s, transform 0.2s;
        }

        .buttons button:hover {
            background: #d9c1ab;
        }

        .buttons button:active {
            transform: scale(0.96);
        }

        .buttons .operator {
            background: var(--primary);
            color: white;
        }

        .buttons .operator:hover {
            background: var(--primary-dark);
        }

        .buttons .clear {
            background: #b68c70;
            color: white;
        }

        .buttons .clear:hover {
            background: #9c7055;
        }

        .buttons .equal {
            background: var(--primary-dark);
            color: white;
        }

        .buttons .equal:hover {
            background: #402b22;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            .navbar {
                padding: 12px 18px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .logo {
                font-size: 22px;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                gap: 10px 18px;
            }

            .nav-links > a,
            .dropbtn {
                font-size: 14px;
            }

            .page-content {
                padding: 155px 15px 25px;
            }

            .dropdown-content {
                left: 0;
            }
        }

        @media (max-width: 380px) {
            .nav-links {
                gap: 8px 12px;
            }

            .calculator {
                padding: 16px;
            }

            .buttons {
                gap: 6px;
            }

            .buttons button {
                padding: 16px 0;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html" class="logo">My Portfolio</a>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#about">About</a>

            <div class="dropdown">
                <button
                    type="button"
                    class="dropbtn"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    Projects <span aria-hidden="true">▾</span>
                </button>

                <div class="dropdown-content">
                    <a href="../project1/para.html">Project 1</a>
                    <a href="../project2/colorpicker.html">Color Picker</a>
                    <a href="../project3/clock.html">Digital Clock</a>
                    <a href="../project4/calculator.html">Calculator</a>
                    <a href="../project5/api.html">API Fetch</a>
                    <a href="../project6/timer.html">Timer</a>
                    <a href="../project7/signal.html">Traffic Signal</a>
                    <a href="../project8/registrationform.html">Registration Form</a>
                    <a href="../project9/imageslider.html">Image Slider</a>
                    <a href="../project10/todo.html">To-Do List</a>
                </div>
            </div>

            <a href="../index.html#contact">Contact</a>
        </div>
    </nav>

    <!-- CALCULATOR -->
    <main class="page-content">
        <section class="calculator" aria-label="Calculator">
            <h2>Calculator</h2>

            <input
                type="text"
                id="display"
                value="0"
                aria-label="Calculator display"
                readonly
            >

            <div class="buttons">
                <button class="clear" data-action="clear">C</button>
                <button data-action="delete">DEL</button>
                <button class="operator" data-value="/">÷</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="equal" data-action="calculate">=</button>

                <button data-value="0">0</button>
                <button data-value=".">.</button>
            </div>
        </section>
    </main>

    <script>
        /* PROJECT DROPDOWN */
        const dropdown = document.querySelector(".dropdown");
        const dropButton = document.querySelector(".dropbtn");

        dropButton.addEventListener("click", function (event) {
            event.stopPropagation();

            const isOpen = dropdown.classList.toggle("active");
            dropButton.setAttribute("aria-expanded", String(isOpen));
        });

        document.addEventListener("click", function (event) {
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
                dropButton.focus();
            }
        });

        /* CALCULATOR LOGIC */
        const display = document.getElementById("display");
        const buttons = document.querySelector(".buttons");

        let firstNumber = null;
        let operator = null;
        let waitingForNumber = false;
        let hasError = false;

        function formatNumber(number) {
            if (!Number.isFinite(number)) {
                return "Error";
            }

            return String(Number(number.toPrecision(12)));
        }

        function calculate() {
            const secondNumber = Number(display.value);
            let result;

            if (operator === "+") {
                result = firstNumber + secondNumber;
            } else if (operator === "-") {
                result = firstNumber - secondNumber;
            } else if (operator === "*") {
                result = firstNumber * secondNumber;
            } else if (operator === "/") {
                if (secondNumber === 0) {
                    display.value = "Cannot divide by zero";
                    firstNumber = null;
                    operator = null;
                    waitingForNumber = true;
                    hasError = true;
                    return;
                }

                result = firstNumber / secondNumber;
            } else {
                return;
            }

            display.value = formatNumber(result);
            firstNumber = null;
            operator = null;
            waitingForNumber = true;
            hasError = display.value === "Error";
        }

        buttons.addEventListener("click", function (event) {
            const button = event.target.closest("button");
            if (!button) return;

            const value = button.dataset.value;
            const action = button.dataset.action;

            if (action === "clear") {
                display.value = "0";
                firstNumber = null;
                operator = null;
                waitingForNumber = false;
                hasError = false;
                return;
            }

            if (hasError) {
                if (action === "delete") {
                    display.value = "0";
                    hasError = false;
                    waitingForNumber = false;
                    return;
                }

                if (value === undefined) return;

                display.value = "0";
                hasError = false;
                waitingForNumber = false;
            }

            if (action === "delete") {
                if (waitingForNumber) {
                    display.value = "0";
                    waitingForNumber = false;
                } else {
                    display.value =
                        display.value.length > 1
                            ? display.value.slice(0, -1)
                            : "0";

                    if (display.value === "-") {
                        display.value = "0";
                    }
                }
                return;
            }

            if (action === "calculate") {
                if (operator !== null && !waitingForNumber) {
                    calculate();
                }
                return;
            }

            if (["+", "-", "*", "/"].includes(value)) {
                if (operator !== null && !waitingForNumber) {
                    calculate();
                }

                if (hasError || !Number.isFinite(Number(display.value))) {
                    return;
                }

                firstNumber = Number(display.value);
                operator = value;
                waitingForNumber = true;
                return;
            }

            if (value === ".") {
                if (waitingForNumber) {
                    display.value = "0.";
                    waitingForNumber = false;
                } else if (!display.value.includes(".")) {
                    display.value += ".";
                }
                return;
            }

            if (/^\d$/.test(value)) {
                if (waitingForNumber || display.value === "0") {
                    display.value = value;
                    waitingForNumber = false;
                } else {
                    display.value += value;
                }
            }
        });
    </script>

</body>
</html>
