    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5eee6;
            --surface: #fffaf5;
            --primary: #795548;
            --primary-dark: #5c4033;
            --accent: #a47148;
            --border: #d8c8b8;
            --text: #46352c;
            --hover: #eee0d1;
            --shadow: 0 8px 25px rgba(92, 64, 51, 0.12);
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-top: 75px;
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 75px;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 9999;
        }

        .logo {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links > a,
        .dropbtn {
            color: var(--primary-dark);
            font-family: inherit;
            font-size: 16px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0;
            transition: color 0.2s ease;
        }

        .nav-links > a:hover,
        .dropbtn:hover {
            color: var(--accent);
        }

        /* PROJECTS DROPDOWN */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 210px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 10000;
            text-align: left;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 16px;
            color: var(--primary-dark);
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .dropdown-content a:hover {
            background: var(--hover);
        }

        /* TRAFFIC SIGNAL DISPLAY */
        h1 {
            color: var(--primary-dark);
            font-size: clamp(26px, 5vw, 36px);
            margin: 30px 15px 20px;
        }

        .intersection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: min(100% - 30px, 420px);
            margin: 25px auto;
        }

        .path {
            background: var(--surface);
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .path h3 {
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        /* Original signal lights preserved */
        .signal {
            background: #222;
            width: 60px;
            padding: 10px 0;
            margin: 10px auto;
            border-radius: 12px;
        }

        .light {
            width: 35px;
            height: 35px;
            margin: 7px auto;
            border-radius: 50%;
            background: #555;
        }

        .red.active {
            background: #ff3030;
            box-shadow: 0 0 12px #ff3030;
        }

        .yellow.active {
            background: #ffd633;
            box-shadow: 0 0 12px #ffd633;
        }

        .green.active {
            background: #22c55e;
            box-shadow: 0 0 12px #22c55e;
        }

        /* CONTROL BUTTONS */
        button.control-btn {
            padding: 10px 24px;
            margin: 8px;
            border: none;
            border-radius: 7px;
            color: white;
            background: var(--primary);
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button.control-btn:hover {
            background: var(--primary-dark);
        }

        #stopBtn {
            background: #a94442;
        }

        #stopBtn:hover {
            background: #843532;
        }

        #status {
            font-weight: bold;
            color: var(--primary-dark);
            margin: 18px 15px 30px;
            line-height: 1.6;
        }

        /* MOBILE LAYOUT */
        @media (max-width: 700px) {
            body {
                padding-top: 140px;
            }

            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 5%;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                gap: 10px 18px;
            }

            .nav-links > a,
            .dropbtn {
                font-size: 14px;
            }

            .intersection {
                gap: 14px;
            }

            .path {
                padding: 12px 8px;
            }
        }

        @media (max-width: 350px) {
            .intersection {
                grid-template-columns: 1fr;
                max-width: 200px;
            }
        }
    </style>
</head>

<body>

    <!-- FOUR-WAY TRAFFIC SIGNAL -->
    <h1>Four-Way Traffic Signal</h1>

    <div class="intersection">
        <div class="path">
            <h3>North</h3>
            <div class="signal">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
        </div>

        <div class="path">
            <h3>East</h3>
            <div class="signal">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
        </div>

        <div class="path">
            <h3>South</h3>
            <div class="signal">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
        </div>

        <div class="path">
            <h3>West</h3>
            <div class="signal">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
        </div>
    </div>

    <button type="button" class="control-btn" id="startBtn">Start</button>
    <button type="button" class="control-btn" id="stopBtn">Stop</button>

    <p id="status" aria-live="polite">
        Press Start to begin.
    </p>

    <script>
        // TRAFFIC SIGNAL LOGIC
        // Signal sequence and timings are unchanged.

        const paths = document.querySelectorAll(".path");
        const status = document.getElementById("status");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");

        const pathNames = ["North", "East", "South", "West"];

        let currentIndex = 0;
        let running = false;
        let phaseTimer;
        let countdownTimer;
        let phaseEndsAt = 0;

        function setLights(activeIndex, color) {
            paths.forEach((path, index) => {
                const red = path.querySelector(".red");
                const yellow = path.querySelector(".yellow");
                const green = path.querySelector(".green");

                red.classList.remove("active");
                yellow.classList.remove("active");
                green.classList.remove("active");

                if (index !== activeIndex || color === "red") {
                    red.classList.add("active");
                } else {
                    path.querySelector("." + color).classList.add("active");
                }
            });
        }

        function startPhase(color, duration, nextPhase) {
            if (!running) return;

            setLights(currentIndex, color);
            phaseEndsAt = Date.now() + duration;

            updateStatus(color);

            clearTimeout(phaseTimer);

            phaseTimer = setTimeout(() => {
                if (running) nextPhase();
            }, duration);
        }

        function updateStatus(color) {
            const seconds = Math.max(
                0,
                Math.ceil((phaseEndsAt - Date.now()) / 1000)
            );

            status.textContent =
                pathNames[currentIndex] + ": " +
                color.toUpperCase() + " — " +
                seconds + " second(s) remaining";
        }

        function runSignal() {
            startPhase("green", 4000, () => {
                startPhase("yellow", 2000, () => {
                    setLights(currentIndex, "red");
                    currentIndex = (currentIndex + 1) % paths.length;
                    runSignal();
                });
            });
        }

        startBtn.addEventListener("click", () => {
            if (running) return;

            running = true;
            currentIndex = 0;

            clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                if (running) {
                    const color = paths[currentIndex].querySelector(".green.active")
                        ? "green"
                        : "yellow";

                    updateStatus(color);
                }
            }, 250);

            runSignal();
        });

        stopBtn.addEventListener("click", () => {
            running = false;

            clearTimeout(phaseTimer);
            clearInterval(countdownTimer);

            setLights(-1, "red");
            status.textContent = "Signals stopped. All directions are red.";
        });

        // PROJECTS DROPDOWN
        const dropdown = document.querySelector(".dropdown");
        const dropButton = document.querySelector(".dropbtn");

        dropButton.addEventListener("click", function (event) {
            event.stopPropagation();

            const isOpen = dropdown.classList.toggle("active");
            dropButton.setAttribute("aria-expanded", String(isOpen));
        });

        // Close dropdown when clicking outside
        document.addEventListener("click", function (event) {
            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
            }
        });

        // Close dropdown with Escape key
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                dropdown.classList.remove("active");
                dropButton.setAttribute("aria-expanded", "false");
                dropButton.focus();
            }
        });

        // Show all-red state before starting
        setLights(-1, "red");
    </script>

</body>
